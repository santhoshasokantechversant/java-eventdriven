# TEMPLATE - copy to secrets.yaml, fill in real values, then deploy.
#   cp k8s/00-config/secrets.example.yaml k8s/00-config/secrets.yaml
# secrets.yaml is gitignored. Never commit real values.
# stringData takes plain text; Kubernetes base64-encodes it for you.
apiVersion: v1
kind: Secret
metadata:
  name: microservices-secrets
type: Opaque
stringData:
  # Application database (shared by user, customer and account services;
  # each service uses its own schema: user_schema, customer_schema, account_schema)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://<db-host>:<db-port>/bank_management"
  SPRING_DATASOURCE_USERNAME: "CHANGE_ME"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME"

  # Keycloak client (realm bank_system, client poc-api-gateway)
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME"
  # Keycloak master-realm admin, used by the services' admin client
  # and to bootstrap the Keycloak admin account
  KEYCLOAK_ADMIN_USERNAME: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "CHANGE_ME"

  # SMTP (Gmail app password)
  SMTP_MAIL_USERNAME: "CHANGE_ME@example.com"
  SMTP_MAIL_PASSWORD: "CHANGE_ME"

  # AES key for reset-password links (16, 24 or 32 characters)
  ENCRYPTION_SECRET_KEY: "CHANGEME16CHARS!"

  # Password of the admin created by POST /api/v1/users/create-admin
  ADMIN_INITIAL_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
type: Opaque
stringData:
  POSTGRES_DB: "keycloakdb"
  POSTGRES_USER: "keycloak"
  POSTGRES_PASSWORD: "CHANGE_ME"
