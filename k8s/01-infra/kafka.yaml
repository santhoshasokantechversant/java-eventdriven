# Single-node Kafka in KRaft mode (no ZooKeeper).
# Internal topics use replication factor 1 because there is only one broker;
# with the default of 3, consumer groups cannot form.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data-pvc
  labels:
    app: kafka
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        fsGroup: 1000   # cp-kafka runs as appuser (uid 1000); lets it write to the volume
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: plaintext
              containerPort: 9092
            - name: controller
              containerPort: 9093
          command:
            - bash
            - -c
            - |
              CLUSTER_ID="MkU3OEVBNTcwNTJENDM2Qk"
              CONFIG_FILE="/tmp/kraft.properties"
              DATA_DIR="/var/lib/kafka/data/logs"
              mkdir -p "$DATA_DIR"

              cat <<EOF > "$CONFIG_FILE"
              process.roles=broker,controller
              node.id=1
              controller.quorum.voters=1@localhost:9093
              controller.listener.names=CONTROLLER
              listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
              advertised.listeners=PLAINTEXT://kafka:9092
              listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
              inter.broker.listener.name=PLAINTEXT
              log.dirs=$DATA_DIR
              num.partitions=3
              auto.create.topics.enable=true
              offsets.topic.replication.factor=1
              transaction.state.log.replication.factor=1
              transaction.state.log.min.isr=1
              EOF

              if [ ! -f "$DATA_DIR/meta.properties" ]; then
                echo "Formatting storage with cluster ID $CLUSTER_ID"
                kafka-storage format --ignore-formatted --cluster-id "$CLUSTER_ID" --config "$CONFIG_FILE"
              fi

              exec kafka-server-start "$CONFIG_FILE"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kafka-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  type: ClusterIP   # advertised as kafka:9092, so only reachable inside the cluster
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
