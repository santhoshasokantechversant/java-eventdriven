# Kafka Broker Configuration
broker.id=1
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# KRaft Configuration (instead of ZooKeeper)
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9093

# Log Configuration
log.dirs=/tmp/kraft-combined-logs
num.partitions=3
num.recovery.threads.per.data.dir=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# Listener Configuration
listeners=PLAINTEXT://:9092,CONTROLLER://:9093
advertised.listeners=PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
inter.broker.listener.name=PLAINTEXT_INTERNAL
controller.listener.names=CONTROLLER

# Auto topic creation (disabled for production)
auto.create.topics.enable=false

# Security (optional - can be enabled later)
# ssl.client.auth=none
# security.inter.broker.protocol=PLAINTEXT

# Performance tuning
message.max.bytes=1000012
replica.fetch.max.bytes=1000012