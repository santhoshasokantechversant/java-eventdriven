version: "3.9"

services:
  configserver:
    image: techversant/configserver:latest
    container_name: configserver
    ports:
      - "8888:8888"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  eureka-server:
    image: techversant/eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - microservices-network
    depends_on:
      configserver:
        condition: service_healthy
  #    healthcheck:
  #      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
  #      interval: 15s
  #      timeout: 5s
  #      retries: 5

  gateway-service:
    image: techversant/gateway-service:latest
    container_name: gateway-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_CLOUD_CONFIG_URI=http://configserver:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SERVER_PORT=8081
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/bank_system
      - KEYCLOAK_SERVER_URL=http://keycloak:8080/
      - KEYCLOAK_REALM=bank_system
      - KEYCLOAK_CLIENT_ID=poc-api-gateway
      - KEYCLOAK_CLIENT_SECRET=hz1l8sUgMfKbtspLxT3WuNQpYRC0Jygi
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - USER_SERVICE=http://10.1.0.47:8082
      - ACCOUNT_SERVICE=http://10.1.0.47:8083
      - CUSTOMER_SERVICE=http://10.1.0.47:8084
      - GATEWAY_SERVICE=http://10.1.0.47:8081
      - SMTP_MAIL_USERNAME=nihaleltonjohn@techversantinfotech.com
      - SMTP_MAIL_PASSWORD=cwylcomuwxivhdkr
      - FORGOT_PASSWORD_FRONTEND_URL=http://10.1.0.47:2000/set-password/
      - ENCRYPTION_SECRET_KEY=MySecretKey12345
      - REGISTER_FRONTEND_URL=http://10.1.0.47:2000/signup
    networks:
      - microservices-network
    depends_on:
      - eureka-server
      - configserver

  user-service:
    image: techversant/user-service:latest
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_CLOUD_CONFIG_URI=http://configserver:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://10.1.0.47:5432/bank_management
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres*&2025
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP=user-service-group
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/bank_system
      - KEYCLOAK_SERVER_URL=http://keycloak:8080/
      - KEYCLOAK_REALM=bank_system
      - KEYCLOAK_CLIENT_ID=poc-api-gateway
      - KEYCLOAK_CLIENT_SECRET=hz1l8sUgMfKbtspLxT3WuNQpYRC0Jygi
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - SMTP_MAIL_USERNAME=nihaleltonjohn@techversantinfotech.com
      - SMTP_MAIL_PASSWORD=cwylcomuwxivhdkr
      - FORGOT_PASSWORD_FRONTEND_URL=http://10.1.0.47:2000/set-password/
      - ENCRYPTION_SECRET_KEY=MySecretKey12345
      - REGISTER_FRONTEND_URL=http://10.1.0.47:2000/signup
    networks:
      - microservices-network
    depends_on:
      - eureka-server
      - configserver
      - keycloak
      - kafka
    restart: always
  #    healthcheck:
  #      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
  #      interval: 20s
  #      timeout: 5s
  #      retries: 5

  account-service:
    image: techversant/account-service:latest
    container_name: account-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_CLOUD_CONFIG_URI=http://configserver:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://10.1.0.47:5432/bank_management
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres*&2025
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP=account-service-group
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/bank_system
      - KEYCLOAK_SERVER_URL=http://keycloak:8080/
      - KEYCLOAK_REALM=bank_system
      - KEYCLOAK_CLIENT_ID=poc-api-gateway
      - KEYCLOAK_CLIENT_SECRET=hz1l8sUgMfKbtspLxT3WuNQpYRC0Jygi
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - SMTP_MAIL_USERNAME=nihaleltonjohn@techversantinfotech.com
      - SMTP_MAIL_PASSWORD=cwylcomuwxivhdkr
      - FORGOT_PASSWORD_FRONTEND_URL=http://10.1.0.47:2000/set-password/
      - ENCRYPTION_SECRET_KEY=MySecretKey12345
      - REGISTER_FRONTEND_URL=http://10.1.0.47:2000/signup
    networks:
      - microservices-network
    depends_on:
      - eureka-server
      - configserver
      - keycloak
      - kafka
    restart: always
  #    healthcheck:
  #      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
  #      interval: 20s
  #      timeout: 5s
  #      retries: 5

  customer-service:
    image: techversant/customer-service:latest
    container_name: customer-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_CLOUD_CONFIG_URI=http://configserver:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_URL=jdbc:postgresql://10.1.0.47:5432/bank_management
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres*&2025
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP=customer-service-group
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/bank_system
      - KEYCLOAK_SERVER_URL=http://keycloak:8080/
      - KEYCLOAK_REALM=bank_system
      - KEYCLOAK_CLIENT_ID=poc-api-gateway
      - KEYCLOAK_CLIENT_SECRET=hz1l8sUgMfKbtspLxT3WuNQpYRC0Jygi
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - SMTP_MAIL_USERNAME=nihaleltonjohn@techversantinfotech.com
      - SMTP_MAIL_PASSWORD=cwylcomuwxivhdkr
      - FORGOT_PASSWORD_FRONTEND_URL=http://10.1.0.47:2000/set-password/
      - ENCRYPTION_SECRET_KEY=MySecretKey12345
      - REGISTER_FRONTEND_URL=http://10.1.0.47:2000/signup
    networks:
      - microservices-network
    depends_on:
      - eureka-server
      - configserver
      - keycloak
      - kafka
    restart: always
  #    healthcheck:
  #      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
  #      interval: 20s
  #      timeout: 5s
  #      retries: 5

  keycloak-db:
    image: postgres:13
    container_name: keycloak-db
    restart: always
    environment:
      POSTGRES_DB: keycloakdb
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - microservices-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: keycloak
    restart: always
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloakdb
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass
    command: ["start-dev"]
    ports:
      - "8182:8080"
    networks:
      - microservices-network
    depends_on:
      - keycloak-db
  #    healthcheck:
  #      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
  #      interval: 30s
  #      timeout: 10s
  #      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
    networks:
      - microservices-network
    #    healthcheck:
    #      test: ["CMD", "bash", "-c", "kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1"]
    #      interval: 20s
    #      timeout: 10s
    #      retries: 10
    restart: always

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8585:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local-kafka"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_ZOOKEEPER: ""
    networks:
      - microservices-network
    depends_on:
      - kafka
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=Poc@*2025   # 👈 admin password
    ports:
      - "9200:9200"
      - "9300:9300"
  #    healthcheck:
  #      test: ["CMD-SHELL", "curl -u elastic:Poc@*2025 --silent --fail http://localhost:9200 || exit 1"]
  #      interval: 30s
  #      timeout: 10s
  #      retries: 5


  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    ports:
      - "8889:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=Poc@*2025
    networks:
      - microservices-network
    depends_on:
      - elasticsearch

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: logstash
    environment:
      - xpack.monitoring.enabled=true
      - xpack.monitoring.elasticsearch.hosts=http://elasticsearch:9200
      - xpack.monitoring.elasticsearch.username=elastic
      - xpack.monitoring.elasticsearch.password=Poc@*2025
    ports:
      - "5000:5000"
      - "9600:9600"
    volumes:
      - ./logging/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    networks:
      - microservices-network
    depends_on:
      - elasticsearch
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:9600"]
#      interval: 30s
#      timeout: 10s
#      retries: 5

networks:
  microservices-network:
    driver: bridge

volumes:
  keycloak-db-data:
  es_data: