spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: gateway-service
  main:
    web-application-type: reactive

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}

  cloud:
    gateway:
      default-filters:
        - TokenRelay
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

server:
  port: 8081
  # Finish in-flight requests before the pod stops (Kubernetes sends SIGTERM)
  shutdown: graceful

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL}
  realm: ${KEYCLOAK_REALM}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME}
    password: ${KEYCLOAK_ADMIN_PASSWORD}
    realm: master

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    prefer-ip-address: true

internal:
  user-service-url: "${USER_SERVICE}"
  account-service-url: "${ACCOUNT_SERVICE}"
  customer-service-url: "${CUSTOMER_SERVICE}"
  gateway-service-url: "${GATEWAY_SERVICE}"

app:
  cors:
    # Comma-separated list of frontend origins allowed to call the API
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:2000,http://10.1.0.47:5173,http://10.1.0.47:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      # /actuator/health/liveness and /actuator/health/readiness for Kubernetes probes
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true

