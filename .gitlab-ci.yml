build-backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker-compose -f docker-compose-prod.yml build
    - docker tag techversant/configserver:latest $DOCKER_USERNAME/configserver:latest
    - docker tag techversant/eureka-server:latest $DOCKER_USERNAME/eureka-server:latest
    - docker tag techversant/gateway-service:latest $DOCKER_USERNAME/gateway-service:latest
    - docker tag techversant/user-service:latest $DOCKER_USERNAME/user-service:latest
    - docker tag techversant/account-service:latest $DOCKER_USERNAME/account-service:latest
    - docker tag techversant/customer-service:latest $DOCKER_USERNAME/customer-service:latest
    - docker push $DOCKER_USERNAME/configserver:latest
    - docker push $DOCKER_USERNAME/eureka-server:latest
    - docker push $DOCKER_USERNAME/gateway-service:latest
    - docker push $DOCKER_USERNAME/user-service:latest
    - docker push $DOCKER_USERNAME/account-service:latest
    - docker push $DOCKER_USERNAME/customer-service:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
      when: always

