stages:
  - test
  - build
  - sast
  - deploy

variables:
  SAST_JAVA_VERSION: "17"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

# Combined Build Job Using build-all.sh
build-all:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - echo "=== Running build-all.sh ==="
    - chmod +x ./build-all.sh
    - ./build-all.sh
  artifacts:
    paths:
      - .m2/repository/
      - "*/target/"
    expire_in: 2 hours
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
      when: always
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "production"'
      when: always

include:
  - template: Security/SAST.gitlab-ci.yml

spotbugs-sast:
  stage: sast
  image: maven:3.9.6-eclipse-temurin-17
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  dependencies:
    - build-all
  before_script:
    - cd account-service
    - chmod +x mvnw || true
    - 'ls -la $CI_PROJECT_DIR/.m2/repository/com/techversant/common-lib/0.0.1-SNAPSHOT/ || echo "WARNING: common-lib not found"'
  script:
    - './mvnw com.github.spotbugs:spotbugs-maven-plugin:spotbugs -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository || mvn com.github.spotbugs:spotbugs-maven-plugin:spotbugs -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
      when: always
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "production"'
      when: always
    - when: never

